# sleepd owns suspend retries. It hands the kernel one attempt per decision,
# guarded by the wakeup_count handshake, and re-runs its policy when the
# kernel refuses. Where the nyx system module suspends through logind,
# systemd-sleep's default "mem standby freeze" would instead fall through to
# s2idle the moment a deep attempt aborts - which is exactly what a handshake
# abort looks like - and the phone would sit in the lighter state until
# something woke it (measured 2026-09-19 on a PinePhone Pro: 469 s in s2idle
# after one aborted deep attempt, with the wakeup-count check bypassed).
# One state only: a refusal comes back to sleepd as a failed suspend and is
# retried with a fresh handshake. "mem" resolves through /sys/power/mem_sleep,
# so a kernel without deep sleep still gets its s2idle.
[Sleep]
SuspendState=mem
