# LuneOS: the OSE sleepd compiles its whole suspend machinery in but ships it
# turned off: enable_idle_check_thread defaults to 0 in the compiled-in config,
# so without this file the daemon runs without an idle-check thread, never
# subscribes to display state, and never initiates suspend - the device simply
# stays awake forever. Keep enable_idle_check_thread enabled here so the
# device sleeps at all.

[general]
debug = 0

[suspend]
wait_idle_ms = 500
after_resume_idle_ms = 1000
wait_suspend_response_ms = 30000
wait_prepare_suspend_ms = 5000
wait_alarms_ms = 5000
suspend_with_charger = false
enable_idle_check_thread = true
